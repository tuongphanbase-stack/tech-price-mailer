name: Send RAM/SSD/Laptop Price Email

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the last step can push the tech-price-state branch

jobs:
  send-price-email:
    runs-on: ubuntu-latest
    env:
      # Without the Gmail secrets, the Send step is skipped (with a warning)
      # instead of failing the run every time.
      HAS_GMAIL: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        # HACOM and Phong Vu load their product grids via client-side JS,
        # so those two categories are rendered in a real headless
        # Chromium tab rather than fetched with a plain HTTP GET.
        # --with-deps also installs the OS-level libraries Chromium needs
        # on the ubuntu-latest runner.
        run: python -m playwright install --with-deps chromium

      - name: Restore dedup state from state branch (if it exists)
        run: |
          git fetch origin tech-price-state:refs/remotes/origin/tech-price-state 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/tech-price-state; then
            mkdir -p state
            git show origin/tech-price-state:state/last_price.json > state/last_price.json 2>/dev/null || true
            git show origin/tech-price-state:state/price_history.json > state/price_history.json 2>/dev/null || true
          fi

      - name: Generate email
        env:
          SEND_ONLY_ON_CHANGE: "true"
          TIMEZONE: "Asia/Ho_Chi_Minh"
        run: python ram_ssd_laptop_price_emailer.py generate

      - name: Warn that the Gmail secrets are missing
        if: env.HAS_GMAIL != 'true'
        run: echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD secrets are not set, so no email was sent. Add them in Settings -> Secrets and variables -> Actions."

      - name: Send email
        if: env.HAS_GMAIL == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TECH_RECIPIENT: ${{ secrets.TECH_RECIPIENT }}
        run: python ram_ssd_laptop_price_emailer.py send

      - name: Commit price snapshot to main
        # docs/index.html and docs/dashboard-data/*.json (the interactive
        # dashboard) are committed alongside the existing CSV snapshot.
        # nullglob so a run where generate_price_dashboard() had nothing to
        # write (no items at all) doesn't error on globs matching zero files.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          if [ -f docs/price_history_latest.csv ]; then
            git add docs/price_history_latest.csv docs/*.html docs/dashboard-data/*.json
            git diff --cached --quiet || git commit -m "Update price snapshot and dashboard [skip ci]"
            git push origin HEAD:main
          fi

      - name: Persist dedup state to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tech-price-state-tmp
          git rm -rf --cached . > /dev/null
          mkdir -p state
          git add -f state/last_price.json
          git add -f state/price_history.json
          git commit -m "Update price state [skip ci]" || echo "No state to commit"
          git push origin tech-price-state-tmp:tech-price-state --force
